version: 2.1
orbs:
  browser-tools: circleci/browser-tools@1.5.3
jobs:
  test-java:
    docker:
      - image: cimg/openjdk:17.0
    steps:
      - checkout
      - run:
          name: Run Tests
          command: mvn clean test
      - store_artifacts:
          path: target/reports
          destination: test-results
workflows:
  build-and-test:
    jobs:
      - test-java